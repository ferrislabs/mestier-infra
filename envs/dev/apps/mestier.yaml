apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mestier-dev
  namespace: argocd
  annotations:
    # Sync-wave 1: runs after mestier-db-dev/mestier-redis-dev (wave 0).
    argocd.argoproj.io/sync-wave: "1"
    # Authorizes the Kargo `dev` Stage (project mestier-delivery) to manage
    # this Application via an `argocd-update` promotion step — without this,
    # Kargo refuses to touch it. See
    # https://docs.kargo.io/user-guide/reference-docs/promotion-steps/argocd-update
    kargo.akuity.io/authorized-stage: mestier-delivery:dev
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: mestier-dev
  sources:
    - repoURL: ghcr.io/ferrislabs/charts
      chart: mestier
      targetRevision: "0.4.0"
      helm:
        valueFiles:
          - $values/base/mestier/values.yaml
          - $values/envs/dev/mestier/values.yaml
    - repoURL: https://github.com/ferrislabs/mestier-infra
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
