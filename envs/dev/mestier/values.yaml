# Mestier Helm values — dev overrides.
api:
  image:
    tag: sha-16be7bb
    # See production's values.yaml for why this is Always, not the chart
    # default — bootstrap-only, until Kargo owns image.tag with sha-* tags.
    pullPolicy: Always
  env:
    ALLOWED_ORIGINS: https://dev.mestier.fr
    # Distinct OIDC client per environment, all against the one shared
    # Ferriskey instance (see base/mestier/values.yaml's AUTH_ISSUER) — so a
    # token issued for staging/production is not accepted here. Register
    # this client id in Ferriskey and create the matching secret below
    # before first sync (see README.md).
    AUTH_CLIENT_ID: mestier-dev
  secret:
    valueFrom:
      # Created out-of-band, same pattern as mestier-rustfs-credentials —
      # never committed. See README.md "Ferriskey OIDC client per environment".
      AUTH_CLIENT_SECRET:
        secretName: mestier-oidc-client
        key: clientSecret

webapp:
  image:
    tag: sha-16be7bb
    pullPolicy: Always
  env:
    API_URL: https://dev-api.mestier.fr
    # /api prefix required — see base/mestier/values.yaml's AUTH_ISSUER comment.
    ISSUER_URL: https://auth.mestier.fr/api/realms/mestier
    # Same client id as api.env.AUTH_CLIENT_ID above — see production's
    # values.yaml for why this isn't sensitive.
    OIDC_CLIENT_ID: mestier-dev

gatewayApi:
  parentRefs:
    - name: mestier-gateway
      namespace: default
  api:
    hostnames:
      - dev-api.mestier.fr
  webapp:
    hostnames:
      - dev.mestier.fr
