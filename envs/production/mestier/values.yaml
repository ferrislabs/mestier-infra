# Mestier Helm values — production overrides.
# Layered on top of base/mestier/values.yaml.

api:
  image:
    tag: "latest"   # bootstrap value — the Kargo production Stage (issue #6) takes ownership of this field
  env:
    ALLOWED_ORIGINS: https://app.mestier.fr
    # Distinct OIDC client per environment, all against the one shared
    # Ferriskey instance (see base/mestier/values.yaml's AUTH_ISSUER) — so a
    # token issued for staging/dev is not accepted here. Register this
    # client id in Ferriskey and create the matching secret below before
    # first sync (see README.md).
    AUTH_CLIENT_ID: mestier
  secret:
    valueFrom:
      # Created out-of-band, same pattern as mestier-rustfs-credentials —
      # never committed. See README.md "Ferriskey OIDC client per environment".
      AUTH_CLIENT_SECRET:
        secretName: mestier-oidc-client
        key: clientSecret

webapp:
  image:
    tag: "latest"
  env:
    API_URL: https://api.mestier.fr
    ISSUER_URL: https://auth.mestier.fr/realms/mestier
    # Same client id as api.env.AUTH_CLIENT_ID above — the frontend needs it
    # for its own PKCE flow, the API needs it to validate tokens issued to
    # it. Not sensitive (a public OAuth client identifier), unlike
    # AUTH_CLIENT_SECRET.
    OIDC_CLIENT_ID: mestier

gatewayApi:
  parentRefs:
    - name: mestier-gateway
      namespace: default
  api:
    hostnames:
      - api.mestier.fr
  webapp:
    hostnames:
      - app.mestier.fr
