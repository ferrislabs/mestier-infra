# Mestier Helm values — production overrides.
# Layered on top of base/mestier/values.yaml.

api:
  image:
    # Owned by the Kargo production Stage (kargo/mestier-delivery/stages/production.yaml)
    # from here on — a real, immutable sha-* tag, no longer the "latest"
    # bootstrap placeholder. Each promotion writes a distinct tag string, so
    # the chart's default pullPolicy (IfNotPresent) is correct and cheaper
    # than Always: a new tag always triggers a real pull, an unchanged one
    # never needs to.
    tag: sha-d0ffed0
  env:
    ALLOWED_ORIGINS: https://app.mestier.fr
    # The API and the webapp are two distinct OIDC clients here — not a
    # shared one — against the one shared Ferriskey instance (see
    # base/mestier/values.yaml's AUTH_ISSUER). Register both in Ferriskey
    # and create the matching secret below before first sync (see
    # README.md).
    AUTH_CLIENT_ID: api
  secret:
    valueFrom:
      # Created out-of-band, same pattern as mestier-rustfs-credentials —
      # never committed. See README.md "Ferriskey OIDC client per environment".
      AUTH_CLIENT_SECRET:
        secretName: mestier-oidc-client
        key: clientSecret

webapp:
  image:
    tag: sha-d0ffed0
  env:
    API_URL: https://api.mestier.fr
    # /api prefix required — see base/mestier/values.yaml's AUTH_ISSUER comment.
    ISSUER_URL: https://auth.mestier.fr/api/realms/mestier
    # Its own client, distinct from api.env.AUTH_CLIENT_ID — a public PKCE
    # client for the browser flow, not the API's. Not sensitive (a public
    # OAuth client identifier), unlike AUTH_CLIENT_SECRET.
    OIDC_CLIENT_ID: webapp

gatewayApi:
  parentRefs:
    - name: mestier-gateway
      namespace: default
  api:
    hostnames:
      - api.mestier.fr
  webapp:
    hostnames:
      - app.mestier.fr
