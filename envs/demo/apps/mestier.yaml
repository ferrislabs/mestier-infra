apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mestier-demo
  namespace: argocd
  annotations:
    # Sync-wave 1: runs after mestier-db-demo/mestier-redis-demo/mestier-rustfs-demo (wave 0).
    argocd.argoproj.io/sync-wave: "1"
    # Authorizes the Kargo `demo` Stage (project mestier-delivery) to manage
    # this Application via an `argocd-update` promotion step — without this,
    # Kargo refuses to touch it. See
    # https://docs.kargo.io/user-guide/reference-docs/promotion-steps/argocd-update
    kargo.akuity.io/authorized-stage: mestier-delivery:demo
spec:
  project: mestier
  destination:
    server: https://kubernetes.default.svc
    namespace: mestier-demo
  source:
    repoURL: https://github.com/ferrislabs/mestier
    targetRevision: main
    path: deploy/helm/mestier
    helm:
      valueFiles:
        - values.yaml
      values: |
        # Demo environment overrides
        api:
          env:
            DATABASE_HOST: "mestier-demo-db"
            AUTH_ISSUER: "http://ferriskey-api.ferriskey.svc.cluster.local:3333/realms/mestier"
            ALLOWED_ORIGINS: "https://demo.mestier.fr"
            RATE_LIMIT_REDIS_URL: "redis://mestier-demo-redis:6379"
            FILE_STORAGE_ENDPOINT: "http://mestier-demo-rustfs:9000"
          secret:
            create: false
            existingSecret: "mestier-demo-secret"
        webapp:
          env:
            API_URL: "https://demo.mestier.fr/api"
            ISSUER_URL: "http://ferriskey-api.ferriskey.svc.cluster.local:3333/realms/mestier"
            OIDC_CLIENT_ID: "webapp-demo"
        gatewayApi:
          parentRefs:
            - name: mestier-gateway
              namespace: default
          api:
            hostnames:
              - demo.mestier.fr
            path: /api
          webapp:
            hostnames:
              - demo.mestier.fr
            path: /
        mcpGateway:
          enabled: true
          existingSecret: "mestier-demo-mcp-secret"
          env:
            MCP_GATEWAY_RESOURCE_URL: "https://demo.mestier.fr/mcp"
            MCP_GATEWAY_ISSUER: "http://ferriskey-api.ferriskey.svc.cluster.local:3333/realms/mestier"
            MCP_GATEWAY_EXCHANGE_AUDIENCE: "api-demo"
        mcpServer:
          enabled: true
          env:
            MCP_SERVER_API_URL: "http://mestier-demo-api:3456"
        cerbos:
          enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
