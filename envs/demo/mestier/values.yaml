# Mestier Helm values — demo overrides.
# Layered on top of base/mestier/values.yaml.
api:
  image:
    # Owned by the Kargo demo Stage (kargo/mestier-delivery/stages/demo.yaml)
    # from here on: a real, immutable sha-* tag written on every push to
    # `main` of the mestier repo, so the chart's default pullPolicy
    # (IfNotPresent) is correct.
    tag: sha-3dd5f77
  env:
    ALLOWED_ORIGINS: https://demo.mestier.fr
    # The realm is base/mestier/values.yaml's (mestier). api-demo/webapp-demo
    # are this environment's own OIDC clients in it. Register both in
    # Ferriskey and create the matching secret below before first sync (see
    # README.md).
    AUTH_CLIENT_ID: api-demo
    # The API only takes tokens that name it or come from a trusted client,
    # and the default is AUTH_CLIENT_ID alone. The browser signs in with
    # webapp-demo, so list it or every call answers 401.
    AUTH_TRUSTED_CLIENTS: webapp-demo
    # Audience of the tokens the MCP gateway swaps in (RFC 8693). The realm has
    # no client called `mestier-api`, so the chart's default does not apply.
    AUTH_AUDIENCE: api-demo
  secret:
    valueFrom:
      # Created out-of-band, never committed. See README.md "Bootstrap".
      AUTH_CLIENT_SECRET:
        secretName: mestier-oidc-client
        key: clientSecret

webapp:
  image:
    tag: sha-d23a588
  env:
    # Same host as the API — see gatewayApi below. The webapp calls its own
    # origin at /api/v1/..., no separate api host.
    API_URL: https://demo.mestier.fr
    ISSUER_URL: https://auth.mestier.fr/api/realms/mestier
    # Public PKCE client for the browser flow, distinct from the API's.
    # Not sensitive, unlike AUTH_CLIENT_SECRET.
    OIDC_CLIENT_ID: webapp-demo

# MCP entry point for Claude / ChatGPT, at https://demo.mestier.fr/mcp. The
# gateway's FerrisKey client secret lives in `mestier-mcp-gateway` (see
# README.md "MCP"). Tags are owned by the Kargo demo Stage, like api and webapp.
mcpGateway:
  enabled: true
  image:
    tag: sha-d23a588
  existingSecret: mestier-mcp-gateway
  env:
    MCP_GATEWAY_RESOURCE_URL: https://demo.mestier.fr/mcp
    MCP_GATEWAY_ISSUER: https://auth.mestier.fr/api/realms/mestier
    MCP_GATEWAY_EXCHANGE_AUDIENCE: api-demo

mcpServer:
  enabled: true
  image:
    tag: sha-3dd5f77

cerbos:
  enabled: true

gatewayApi:
  parentRefs:
    - name: mestier-gateway
      namespace: default
  # One host for both — mirrors Ferriskey's own auth.mestier.fr split
  # (/api -> ferriskey-api, / -> ferriskey-webapp). api's PathPrefix "/api"
  # is evaluated ahead of webapp's catch-all "/" regardless of which
  # HTTPRoute object is applied first — Gateway API merges routes for a
  # hostname by path specificity, not by object identity.
  api:
    hostnames:
      - demo.mestier.fr
    path: /api
  webapp:
    hostnames:
      - demo.mestier.fr
    path: /
  mcp:
    hostnames:
      - demo.mestier.fr
