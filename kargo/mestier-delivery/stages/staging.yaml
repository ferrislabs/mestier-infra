# Stage `staging`: promotes only Freight that has already been verified on
# `dev` (sources.stages). Auto-promotion granted via ProjectConfig, see dev.yaml
# header for the sourcing notes shared by all three Stages.
#
# argocd-update + http notify: see dev.yaml for why the argocd-update step is
# what makes "verified" mean something (Implicit ArgoCD Verification, no
# Argo Rollouts needed) — same reasoning here, against `mestier-staging`.
# The http step notifies Discord and only runs once argocd-update has
# actually returned success, i.e. once staging is observably Healthy — so a
# broken deploy never gets reported as "promoted".
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: mestier-delivery
  annotations:
    # Wave 2: after `dev` (wave 1) — not a hard Kargo requirement (Stages don't
    # need their upstream Stage applied first, requestedFreight.sources.stages
    # is just a name reference resolved at reconcile time), but keeping the
    # apply order matching the promotion order makes the manifests easier to
    # reason about.
    argocd.argoproj.io/sync-wave: "2"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: mestier
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/ferrislabs/mestier-infra
            checkout:
              - branch: main
                path: ./out
        - uses: yaml-update
          as: update-values
          config:
            path: ./out/envs/staging/mestier/values.yaml
            updates:
              - key: api.image.tag
                value: ${{ imageFrom("ghcr.io/ferrislabs/mestier-api").Tag }}
              - key: webapp.image.tag
                value: ${{ imageFrom("ghcr.io/ferrislabs/mestier-webapp").Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: ${{ outputs['update-values'].commitMessage }}
        - uses: git-push
          as: push
          config:
            path: ./out
            targetBranch: main
        - uses: argocd-update
          config:
            apps:
              - name: mestier-staging
                namespace: argocd
        # A real Discord embed, not a bare `content` string: a title,
        # a link back to the commit that triggered this, per-image fields
        # (`inline: true` puts api/webapp side by side), and a footer
        # naming where this came from — the same information the plain
        # message carried, laid out the way Discord actually renders it
        # instead of one run-on sentence.
        - uses: http
          as: notify-discord
          config:
            method: POST
            url: ${{ secret('discord-webhook').url }}
            headers:
              - name: Content-Type
                value: application/json
            body: >-
              ${{ quote({
                "embeds": [{
                  "title": "🚧 staging — mestier promoted",
                  "url": outputs['push'].commitURL,
                  "description": "Verified **Healthy** in ArgoCD.",
                  "color": 16099875,
                  "fields": [
                    {
                      "name": "api",
                      "value": "`" + imageFrom("ghcr.io/ferrislabs/mestier-api").Tag + "`",
                      "inline": true
                    },
                    {
                      "name": "webapp",
                      "value": "`" + imageFrom("ghcr.io/ferrislabs/mestier-webapp").Tag + "`",
                      "inline": true
                    }
                  ],
                  "footer": { "text": "Kargo · mestier-delivery" }
                }]
              }) }}
