{{- include "kargo-platform.validate" . -}}
{{- if .Values.argocdRbac.create }}
# Grants the Kargo controller access to Argo CD's `Application` resources.
# Originally read-only (get/list/watch): promotion itself is done by
# writing to git, and Argo CD's own `automated`+`selfHeal` sync policy is
# what actually deploys the change, with no help from Kargo.
#
# `patch` was added once every Stage's `promotionTemplate` grew an
# `argocd-update` step (see mestier-delivery/kargo/stages/*.yaml): that
# step is what activates Kargo's "Implicit ArgoCD Verification" — it
# patches the Application to force a refresh and to register an ongoing
# health check Kargo itself reads back, which is how "promoted" comes to
# mean "observed Healthy" rather than merely "git push succeeded". Without
# `patch`, that one step errors with a 403 from the Kubernetes API itself
# (never reaching Argo CD), the Promotion is left `Errored`, and the
# Stage's health is stuck `Unknown` — even though Argo CD's own sync
# already deployed the new image correctly, since that path never needed
# this Role at all.
#
# This replaces (rather than complements) the upstream kargo chart's own
# Argo CD integration RBAC — see the `argocd:` block in values.yaml, which
# disables it via `argocd.dataPlane.install` /
# `argocd.dataPlane.kargoController.install`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-controller-argocd-viewer
  namespace: {{ .Values.argocdRbac.namespace }}
  labels:
    {{- include "kargo-platform.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-controller-argocd-viewer
  namespace: {{ .Values.argocdRbac.namespace }}
  labels:
    {{- include "kargo-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-controller-argocd-viewer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocdRbac.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
