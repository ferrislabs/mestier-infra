# ---------------------------------------------------------------------------
# argocd-platform values
# ---------------------------------------------------------------------------

# Hostname Argo CD is served on. You MUST also add this host to the
# gateway-platform release (gateway.hosts) so the shared Gateway gets a matching
# HTTPS listener + cert, and create an A record pointing at the LB IP.
host: argocd.internal.ferriskey.rs

# Reference to the shared Envoy Gateway created by the gateway-platform release.
gateway:
  name: internal-gateway
  namespace: default

# HTTPRoute that exposes the Argo CD server through the shared Gateway.
httpRoute:
  create: true
  # Service from the argo-cd subchart. With fullnameOverride=argocd below it is
  # "argocd-server" (port 80, plaintext — TLS is terminated at the Gateway).
  serviceName: argocd-server
  servicePort: 80

# ---- Bundled Argo CD (upstream argo-cd subchart) --------------------------
# Chart defaults are non-HA (single replicas, no redis-ha) — nothing to add.
argo-cd:
  enabled: true
  fullnameOverride: argocd

  global:
    # Keep in sync with `host` above.
    domain: argocd.internal.ferriskey.rs

  # Direct OIDC against your provider — Dex is not needed.
  dex:
    enabled: false

  # Vercel-style PR comment when a preview environment (previews/applicationset.yaml)
  # finishes deploying. Scoped to preview Applications only, via the
  # notifications.argoproj.io/subscribe.on-preview-deployed.webhook annotation
  # on that ApplicationSet's template — dev/staging/production never subscribe,
  # so this notifier never fires for them.
  #
  # secret.create is false on purpose: the chart's own Secret template
  # re-renders `data` from notifications.secret.items on every `helm upgrade`,
  # which would wipe a token added out-of-band. Same reasoning as
  # `mestier-oidc-client` elsewhere in this repo — manage the real secret by
  # hand, once (see README "Preview environments" bootstrap steps):
  #   kubectl -n argocd create secret generic argocd-notifications-secret \
  #     --from-literal=github-comment-token="<fine-grained PAT, ferrislabs/mestier, Issues: read/write>"
  notifications:
    secret:
      create: false

    notifiers:
      service.webhook.github-pr-comment: |
        url: https://api.github.com
        headers:
        - name: Authorization
          value: Bearer $github-comment-token
        - name: Accept
          value: application/vnd.github+json

    triggers:
      # oncePer app name, not sync revision: previews re-sync on every push to
      # the PR (mutable pr-<n> image tag), and we want one welcome comment per
      # PR, not one per resync.
      trigger.on-preview-deployed: |
        - when: app.status.operationState.phase == 'Succeeded' and app.status.sync.status == 'Synced' and app.status.health.status == 'Healthy'
          oncePer: app.metadata.name
          send: [preview-deployed-comment]

    templates:
      template.preview-deployed-comment: |
        webhook:
          github-pr-comment:
            method: POST
            path: |
              {{- $pr := index .app.metadata.annotations "preview.mestier.fr/pull-request" | splitList "/" | last -}}
              /repos/ferrislabs/mestier/issues/{{ $pr }}/comments
            body: |
              {{- $pr := index .app.metadata.annotations "preview.mestier.fr/pull-request" | splitList "/" | last -}}
              {{- $url := printf "https://pr-%s.mestier.fr" $pr -}}
              {"body": "🚀 **Preview deployed:** {{ $url }}\n\nSynced revision `{{.app.status.sync.revision}}`."}

  configs:
    params:
      # TLS terminates at the Gateway; serve the API/UI in insecure (HTTP) mode
      # so Envoy can talk plain HTTP/2 to argocd-server.
      server.insecure: true

    cm:
      # Teach Argo CD how to assess the health of CloudNativePG Clusters so the
      # app-of-apps actually waits for the database before the next sync-wave.
      resource.customizations.health.postgresql.cnpg.io_Cluster: |
        local hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message
                return hs
              end
            end
          end
          if obj.status.phase ~= nil then
            if obj.status.phase == "Cluster in healthy state" then
              hs.status = "Healthy"
              hs.message = obj.status.phase
              return hs
            end
            hs.status = "Progressing"
            hs.message = obj.status.phase
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for CNPG cluster to be ready"
        return hs
